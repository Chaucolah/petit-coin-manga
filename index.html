<meta charset="utf-8">
<title>Petit Coin Manga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0; --surface:#ffffff; --surface-2:#f3ede3;
    --ink:#2c2a2e; --ink-soft:#6b6873; --line:#e6ddcf;
    --sage:#6e9083; --sage-ink:#2f453e; --lavender:#8d86a8;
    --gold:#2e8b57; --gold-bg:#dcf3e3;
    --grad1:#0de0c4; --grad2:#ff2996; --grad3:#d9bdf0;
    --shadow: 0 1px 2px rgba(44,42,46,0.04), 0 8px 24px rgba(44,42,46,0.06);
    --radius: 14px;
    --body-bg:#faf5ff;
    --body-grad-layer: linear-gradient(150deg, var(--grad1) 0%, var(--grad2) 20%, var(--grad3) 50%, #ecdff5 75%, #faf5ff 100%);
    --body-pattern-layer: none;
    --footer-bg: transparent;
  }
  /* Le site reste toujours en thème clair, meme si l'appareil est en mode sombre */
  *{box-sizing:border-box;}
  body{margin:0; background-color:var(--body-bg); background-image:var(--body-pattern-layer), var(--body-grad-layer); background-position:0 0, 0 0; background-size:16px 16px, 100% 100%; background-repeat:repeat, no-repeat; color:var(--ink); font-family:'Manrope', system-ui, sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Comfortaa','Manrope',system-ui,sans-serif; text-wrap:balance; font-weight:700; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:1280px; margin:0 auto; padding:0 16px;}

  header.site{position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .site-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-size:1.15rem; color:var(--ink);}
  .brand-mark{width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover; box-shadow:0 0 0 1px var(--line);}
  nav.site-nav{display:flex; gap:28px; font-size:0.92rem; color:var(--ink-soft);}
  nav.site-nav a{text-decoration:none; cursor:pointer; padding-bottom:2px; border-bottom:2px solid transparent;}
  nav.site-nav a:hover{color:var(--ink);}
  nav.site-nav a.active{color:var(--ink); border-bottom-color:var(--sage);}
  .header-contact-link{display:flex; align-items:center; color:var(--ink-soft); text-decoration:none; cursor:pointer; font-weight:600; font-size:0.88rem; border:1px solid var(--line); border-radius:999px; padding:8px 14px; background:var(--surface);}
  .header-contact-link:hover{color:var(--ink);}
  .header-contact-link.active{background:var(--sage); border-color:var(--sage); color:#fff;}

  .contact-page{padding:56px 0 72px; display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start;}
  .contact-page h1{font-size:2rem; margin:0 0 12px;}
  .vendre-page{padding:56px 0 72px;}
  .vendre-page h1{font-size:2rem; margin:0 0 24px;}
  .contact-page p.lead{color:var(--ink-soft); font-size:1rem; max-width:42ch; margin:0 0 22px;}
  .contact-info{display:flex; flex-direction:column; gap:10px; font-size:0.92rem; color:var(--ink-soft);}
  .contact-info strong{color:var(--ink);}
  .contact-form{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; display:flex; flex-direction:column; gap:16px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field label{font-size:0.82rem; font-weight:700; color:var(--ink-soft);}
  .form-field input, .form-field textarea{
    font-family:inherit; font-size:0.92rem; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; resize:vertical;
  }
  .form-field input:focus, .form-field textarea:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .contact-form .btn-primary{align-self:flex-start;}
  .contact-form .btn-primary:disabled{opacity:0.6; cursor:default;}
  .parametres-page{padding:24px 0 60px;}
  .settings-toolbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
  .settings-hint{margin:0; font-size:0.85rem; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--sage); border-radius:12px; padding:10px 14px; flex:1; min-width:220px;}
  .settings-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:20px;}
  .settings-swatches{display:flex; flex-wrap:wrap; gap:16px;}
  .settings-swatch{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:0.75rem; font-weight:700; color:var(--ink-soft);}
  .settings-swatch input[type="color"]{width:42px; height:42px; padding:0; border:2px solid var(--line); border-radius:50%; background:var(--bg); cursor:pointer; overflow:hidden;}
  .settings-bgimage-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .settings-bgimage-preview{width:96px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line); box-shadow:var(--shadow);}
  .settings-bgimage-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .settings-upload-btn{cursor:pointer;}
  .settings-actions{display:flex; align-items:center; justify-content:flex-end; gap:14px; flex-wrap:wrap;}
  [contenteditable="true"][data-settings-field]{outline:2px dashed color-mix(in srgb, var(--sage) 45%, transparent); outline-offset:3px; border-radius:6px; cursor:text;}
  [contenteditable="true"][data-settings-field]:hover{outline-color:var(--sage);}
  [contenteditable="true"][data-settings-field]:focus{outline-style:solid; background:color-mix(in srgb, var(--sage) 10%, transparent);}
  .form-status{font-size:0.86rem; padding:2px 0;}
  .form-status.ok{color:var(--sage-ink);}
  .form-status.err{color:#b1452f;}
  @media (max-width:760px){ .contact-page{grid-template-columns:1fr;} }
  .header-actions{display:flex; align-items:center; gap:10px;}
  .cart-pill, .edit-toggle{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:0.88rem; font-weight:600; background:var(--surface); font-family:inherit; cursor:pointer; color:var(--ink);}
  .check-ico{display:inline-block; color:var(--sage);}
  .cart-pill:hover{border-color:var(--sage); color:var(--sage-ink);}
  .edit-toggle{cursor:pointer; color:var(--ink);}
  .auth-dropdown{position:absolute; top:calc(100% + 10px); right:0; width:280px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; z-index:20; text-align:left;}
  .auth-dropdown input{width:100%; font-family:inherit; font-size:0.88rem; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink);}
  .auth-dropdown input:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .edit-toggle.active{background:var(--sage); border-color:var(--sage); color:#fff;}

  .hero{padding:56px 0 40px;}
  .hero-inner{display:grid; grid-template-columns:1fr; gap:40px; align-items:center; text-align:center;}
  .hero-inner .hero-actions{justify-content:center;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--sage-ink); background:color-mix(in srgb, var(--sage) 16%, transparent); border-radius:999px; padding:6px 12px; margin-bottom:18px;}
  .hero h1{font-size:clamp(2.1rem, 4.4vw, 3.2rem); margin:0 0 16px; line-height:1.08; font-weight:800; letter-spacing:-0.015em;}
  .hero p.lead{color:var(--ink-soft); font-size:1.05rem; max-width:46ch; margin:0 0 26px;}
  .hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
  .btn{border:none; border-radius:999px; padding:13px 24px; font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--sage); color:#fff;}
  .btn-primary:hover{background:color-mix(in srgb, var(--sage) 85%, black);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .hero-art{aspect-ratio:4/3; border-radius:20px; background:radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--gold) 55%, transparent), transparent 55%), radial-gradient(circle at 75% 70%, color-mix(in srgb, var(--lavender) 55%, transparent), transparent 55%), linear-gradient(135deg, var(--sage), var(--lavender)); position:relative; overflow:hidden; box-shadow:var(--shadow);}
  .hero-art svg{position:absolute; inset:0; width:100%; height:100%;}
  .top-banner{position:relative; width:100%; aspect-ratio:1563/625; max-height:340px; border-radius:20px; overflow:hidden; margin:20px 0 8px; box-shadow:var(--shadow);}
  .top-banner img.banner-photo{width:100%; height:100%; object-fit:cover; object-position:70% 35%; display:block;}
  .banner-nav{position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:flex-start; padding:26px 24px 16px 34px; z-index:2;}
  .banner-nav .brand{text-shadow:0 1px 4px rgba(255,255,255,0.9), 0 1px 12px rgba(255,255,255,0.6);}
  .banner-nav .brand-mark{width:40px; height:40px; box-shadow:0 2px 8px rgba(0,0,0,0.25), 0 0 0 2px #fff;}
  .banner-actions-row{display:flex; justify-content:flex-end; padding:12px 0 4px;}
  .banner-title{position:absolute; left:28px; right:44%; bottom:22px; z-index:2;}
  .banner-title h1{font-size:clamp(2rem, 5vw, 3.6rem); font-weight:900; line-height:1.05; margin:0; color:#2c2a22; text-shadow:0 1px 3px rgba(255,255,255,0.85), 0 2px 20px rgba(255,255,255,0.7), 0 2px 20px rgba(255,255,255,0.7);}
  @media (max-width:640px){
    .banner-title{right:24px; bottom:16px;}
    .banner-nav{flex-wrap:wrap; gap:8px;}
  }

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 32px;}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px; font-size:0.86rem; font-weight:600; cursor:pointer; color:var(--ink-soft); transition:all .15s ease;}
  .chip:hover{color:var(--ink); border-color:var(--ink-soft);}
  .chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  section.catalog{padding:8px 0 64px;}
  .catalog h2{font-size:2rem; margin:0 0 4px; font-weight:800; text-transform:uppercase; letter-spacing:-0.01em;}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; margin-bottom:4px;}
  .catalog .sub{color:var(--ink-soft); font-size:0.94rem; margin:0 0 24px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:20px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;}
  .cover{aspect-ratio:3/4; position:relative; display:flex; align-items:center; justify-content:center; color:#fff;}
  .cover svg{width:46%; height:46%; opacity:0.92;}
  .cover .badge{position:absolute; top:10px; left:10px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; background:rgba(255,255,255,0.92); color:var(--ink); border-radius:999px; padding:4px 10px;}
  .cover .discount-badge{position:absolute; top:10px; right:10px; font-size:0.72rem; font-weight:800; background:#d31d16; color:#fff; border-radius:999px; padding:4px 10px; box-shadow:0 1px 4px rgba(0,0,0,0.25); z-index:2;}
  .remise-field .fiche-field{min-width:26px; padding:2px 6px; font-size:0.8rem;}
  .cover .photo-note{position:absolute; bottom:10px; right:10px; font-size:0.66rem; background:rgba(0,0,0,0.35); color:#fff; border-radius:6px; padding:3px 7px;}
  .card-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card-body h3{font-size:0.98rem; margin:0; font-family:'Manrope'; font-weight:700;}
  .card-title-row{display:flex; align-items:center; gap:6px;}
  .desc-row{display:flex; align-items:flex-start; gap:6px;}
  .field-edit-btn{border:none; background:transparent; cursor:pointer; opacity:0.5; padding:2px; line-height:1; color:var(--ink-soft); flex:none;}
  .field-edit-btn svg{width:14px; height:14px; display:block;}
  .field-edit-btn:hover{opacity:1; color:var(--sage-ink);}
  [contenteditable="true"][data-idx][data-field]:not(.fiche-field){outline:1.5px dashed color-mix(in srgb, var(--sage) 50%, transparent); outline-offset:3px; border-radius:5px; cursor:text;}
  [contenteditable="true"][data-idx][data-field]:not(.fiche-field):hover{outline-color:var(--sage);}
  [contenteditable="true"][data-idx][data-field]:not(.fiche-field):focus{outline-style:solid; background:color-mix(in srgb, var(--sage) 8%, transparent);}
  .cover-photo-btn{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:46px; height:46px; border-radius:50%; background:rgba(20,18,16,0.6); color:#fff; border:2px solid rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:3; padding:0;}
  .cover-photo-btn:hover{background:rgba(20,18,16,0.8);}
  .cover-photo-btn svg{width:20px; height:20px;}
  .card-body .desc{font-size:0.83rem; color:var(--ink-soft); margin:0;}
  .price-row{margin-top:auto; display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums;}
  .price-old{color:var(--ink-soft); text-decoration:line-through; font-size:0.84rem;}
  .price-new{color:var(--gold); font-weight:800; font-size:1.15rem;}
  .add-row{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
  .add-btn{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 13px; font-size:0.78rem; font-weight:700; color:var(--ink); cursor:pointer;}
  .add-btn:hover{background:var(--sage); border-color:var(--sage); color:#fff;}
  .add-btn:disabled{opacity:0.5; cursor:default;}
  .add-btn:disabled:hover{background:transparent; border-color:var(--line); color:var(--ink);}
  .add-btn.in-cart{background:var(--sage); border-color:var(--sage); color:#fff;}
  .edit-item-btn{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 13px; font-size:0.78rem; font-weight:700; color:var(--ink); cursor:pointer;}
  .edit-item-btn:hover{border-color:var(--sage); color:var(--sage-ink);}
  .edit-item-btn.active{background:var(--sage); border-color:var(--sage); color:#fff;}
  .cart-list{list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:12px;}
  .cart-line{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px;}
  .cart-line-img{width:52px; height:66px; flex:none; border-radius:8px; background-size:cover; background-position:center; background-color:var(--surface-2);}
  .cart-line-info{flex:1; display:flex; flex-direction:column; gap:2px;}
  .cart-line-info strong{font-size:0.94rem;}
  .cart-line-info span{color:var(--gold); font-weight:800; font-size:0.9rem;}
  .cart-remove-btn{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 13px; font-size:0.78rem; font-weight:700; color:#a8493f; cursor:pointer;}
  .cart-remove-btn:hover{background:#fbebe8; border-color:#e3c3bd;}
  .cart-total{text-align:right; font-size:1.1rem; font-weight:800; color:var(--ink); padding-top:14px; border-top:1px solid var(--line);}
  .pay-box{display:flex; flex-direction:column; align-items:flex-end; gap:8px; margin-top:18px;}
  .pay-btn{justify-content:center; padding:12px 28px; font-size:0.95rem;}
  .pay-note{margin:0; font-size:0.76rem; color:var(--ink-soft); text-align:right; max-width:320px;}
  .cover.is-sold img{filter:grayscale(1) brightness(0.6);}
  .sold-ribbon{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,18,16,0.12); padding:10px;}
  .sold-ribbon span{background:rgba(255,255,255,0.92); color:#d31d16; font-weight:900; font-size:1.9rem; line-height:1; text-transform:uppercase; letter-spacing:0.05em; padding:8px 18px; border-radius:8px; border:4px solid #d31d16; transform:rotate(-10deg); box-shadow:0 4px 14px rgba(0,0,0,0.35); text-align:center;}
  .card-actions{display:flex; gap:8px; padding:0 16px 14px;}
  .card-actions .sold-toggle-btn{flex:1; border-radius:999px; padding:6px 8px; font-size:0.72rem; font-weight:700; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink);}
  .card-actions .sold-toggle-btn.active{background:var(--gold-bg); border-color:var(--gold); color:var(--gold);}
  .card-actions .delete-item-btn{flex:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:999px; cursor:pointer; border:1px solid #e3c3bd; background:transparent; color:#a8493f; padding:0;}
  .card-actions .delete-item-btn svg{width:16px; height:16px;}
  .card-actions .delete-item-btn:hover{background:#fbebe8;}
  .card-actions{flex-wrap:wrap;}
  .color-edit-btn{flex:1; border-radius:999px; padding:6px 8px; font-size:0.72rem; font-weight:700; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink);}
  .color-edit-btn:hover{border-color:var(--sage); color:var(--sage-ink);}
  .card-color-palette{display:flex; align-items:center; gap:6px; flex-wrap:wrap; width:100%; padding-top:8px;}
  .palette-swatch{width:24px; height:24px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;}
  .palette-swatch.active{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--ink);}
  .palette-custom{width:30px; height:30px; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--bg); cursor:pointer; overflow:hidden;}
  .palette-confirm-btn{width:28px; height:28px; border-radius:50%; border:none; background:var(--sage); color:#fff; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .palette-confirm-btn:hover{filter:brightness(0.92);}
  .add-card{border:2px dashed var(--line); border-radius:var(--radius); background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:280px; width:100%; color:var(--ink-soft); font-family:inherit; cursor:pointer; transition:border-color .15s, color .15s, background .15s;}
  .add-card:hover{border-color:var(--sage); color:var(--sage-ink); background:var(--surface-2);}
  .add-card .plus{font-size:2.6rem; font-weight:300; line-height:1;}
  .add-card .label{font-size:0.85rem; font-weight:700;}

  [contenteditable="true"].fiche-field{display:inline-block; min-width:60px; border:1px solid var(--line); border-radius:8px; padding:4px 10px; background:var(--surface); cursor:text;}
  [contenteditable="true"].fiche-field:hover{border-color:var(--sage);}
  [contenteditable="true"].fiche-field:focus{border-color:var(--sage); outline:2px solid color-mix(in srgb, var(--sage) 25%, transparent); background:color-mix(in srgb, var(--sage) 8%, transparent);}
  [contenteditable="true"]:empty::before{content:attr(data-placeholder); color:var(--ink-soft); opacity:0.6; font-weight:400;}
  .field-list li{align-items:center;}
  .percent-field{display:inline-flex; align-items:baseline; gap:2px;}
  .percent-field .percent-sign{font-weight:700;}

  section.seller{padding:24px 0 72px;}
  .seller-box{background:var(--surface-2); border:1px dashed var(--line); border-radius:20px; padding:28px; display:flex; flex-direction:column; gap:22px;}
  .modal-overlay{position:fixed; inset:0; background:rgba(20,18,16,0.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .modal-panel{position:relative; background:var(--surface); border-radius:20px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .modal-panel .seller-box{border:none; border-radius:20px;}
  .modal-close{position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:1rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:1;}
  .modal-close:hover{background:var(--sage); border-color:var(--sage); color:#fff;}
  .seller-box h2{font-size:1.25rem; margin:0 0 8px;}
  .seller-box p{color:var(--ink-soft); font-size:0.9rem; margin:0 0 16px; max-width:44ch;}
  .field-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:0.86rem;}
  .field-list li{display:flex; justify-content:space-between; gap:12px; padding:4px 0; border-bottom:1px solid var(--line);}
  .field-list span:first-child{color:var(--ink-soft); flex:none;}
  .field-list span:last-child{font-weight:700; font-variant-numeric:tabular-nums; text-align:right;}
  .margin-line span:last-child{color:var(--sage-ink); background:color-mix(in srgb, var(--sage) 18%, transparent); padding:2px 8px; border-radius:6px;}
  .internal-tag{display:inline-block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); background:var(--gold-bg); border-radius:6px; padding:3px 8px; margin-bottom:10px;}

  footer.site{border-top:1px solid var(--line); padding:44px 0 20px; margin-top:40px; background:var(--footer-bg);}
  .footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; color:var(--footer-ink, var(--ink-soft)); font-size:0.84rem;}
  .footer-brand{display:flex; align-items:center; gap:10px; color:var(--footer-ink, var(--ink)); font-weight:700; font-family:'Comfortaa','Manrope',system-ui,sans-serif;}
  .footer-mark{width:28px; height:28px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 1px var(--line);}
  .footer-nav{display:flex; gap:26px; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em;}
  .footer-nav a{text-decoration:none; color:var(--footer-ink, var(--ink-soft)); cursor:pointer;}
  .footer-nav a:hover{color:var(--footer-ink, var(--ink));}
  .footer-copy{color:var(--footer-ink, color-mix(in srgb, var(--ink-soft) 70%, transparent)); font-size:0.72rem;}
  @media (max-width:640px){ .footer-inner{justify-content:center; text-align:center;} }

  .savebar{position:fixed; left:0; width:100%; bottom:0; z-index:9; display:none; justify-content:center; padding:14px; background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .savebar.show{display:flex;}
  .savebar-inner{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:999px; padding:8px 10px 8px 18px;}
  .savebar-status{font-size:0.83rem; color:var(--ink-soft);}
  .save-btn{background:var(--ink); color:var(--bg); border:none; border-radius:999px; padding:10px 18px; font-family:inherit; font-weight:700; font-size:0.85rem; cursor:pointer;}
  .save-btn:disabled{opacity:0.5; cursor:default;}

  @media (max-width:760px){
    nav.site-nav{display:none;}
  }
</style>

  function applySettingsTheme(){
    var r = document.documentElement.style;
    var c = SETTINGS.colors || {};
    if (c.sage) r.setProperty('--sage', c.sage);
    if (c.ink) r.setProperty('--ink', c.ink);
    if (c.surface) r.setProperty('--surface', c.surface);
    if (c.gold) r.setProperty('--gold', c.gold);
    if (c.grad1) r.setProperty('--grad1', c.grad1);
    if (c.grad2) r.setProperty('--grad2', c.grad2);
    if (c.grad3) r.setProperty('--grad3', c.grad3);
    if (c.bodyBg) {
      r.setProperty('--body-bg', c.bodyBg);
      r.setProperty('--body-grad-layer', 'none');
    } else {
      r.removeProperty('--body-bg');
      r.removeProperty('--body-grad-layer');
    }
    if (c.footerBg) r.setProperty('--footer-bg', c.footerBg);
    else r.removeProperty('--footer-bg');
    if (c.footerInk) r.setProperty('--footer-ink', c.footerInk);
    else r.removeProperty('--footer-ink');
    if (c.pattern === false) r.setProperty('--body-pattern-layer', 'none');
    else r.removeProperty('--body-pattern-layer');
    if (c.bgImage) {
      document.body.style.backgroundImage = 'url("'+c.bgImage+'")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundAttachment = 'fixed';
      document.body.style.backgroundPosition = 'center top';
      document.body.style.backgroundRepeat = 'no-repeat';
    } else {
      document.body.style.backgroundImage = '';
      document.body.style.backgroundSize = '';
      document.body.style.backgroundAttachment = '';
      document.body.style.backgroundPosition = '';
      document.body.style.backgroundRepeat = '';
    }
  }

  function fetchSiteSettings(){
    fetch(SUPABASE_URL + '/rest/v1/site_settings?id=eq.1&select=colors,texts,categories', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    }).then(function(res){ return res.ok ? res.json() : []; }).then(function(rows){
      var row = rows && rows[0];
      if (!row) return;
      SETTINGS = {
        colors: Object.assign({}, DEFAULT_SETTINGS.colors, row.colors || {}),
        texts: Object.assign({}, DEFAULT_SETTINGS.texts, row.texts || {}),
        categories: Object.assign({}, DEFAULT_SETTINGS.categories, row.categories || {})
      };
      applySettingsTheme();
      render();
    }).catch(function(){});
  }

  function saveSiteSettings(){
    if (!ui.auth.session || !ui.auth.session.access_token) return;
    settingsBusy = true; settingsStatus = ''; render();
    fetch(SUPABASE_URL + '/rest/v1/site_settings?id=eq.1', {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + ui.auth.session.access_token,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ colors: settingsDraft.colors, texts: settingsDraft.texts, categories: settingsDraft.categories, updated_at: new Date().toISOString() })
    }).then(function(res){ return res.ok ? res.json() : Promise.reject(res.status); })
      .then(function(rows){
        var row = rows && rows[0];
        if (row) {
          SETTINGS = { colors: Object.assign({}, DEFAULT_SETTINGS.colors, row.colors||{}), texts: Object.assign({}, DEFAULT_SETTINGS.texts, row.texts||{}), categories: Object.assign({}, DEFAULT_SETTINGS.categories, row.categories||{}) };
        }
        settingsDraft = JSON.parse(JSON.stringify(SETTINGS));
        applySettingsTheme();
        settingsBusy = false;
        settingsStatus = 'Enregistré ✓, visible par tous tes visiteurs.';
        render();
      }).catch(function(code){
        settingsBusy = false;
        if (code === 401 || code === 403) {
          clearSession();
          ui.auth.session = null;
          settingsStatus = 'Ta session a expiré, reconnecte-toi puis réessaie d\'enregistrer.';
        } else {
          settingsStatus = 'Échec de l\'enregistrement (réseau), réessaie.';
        }
        render();
      });
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function ce(on){ return on ? ' contenteditable="true"' : ''; }

  function money(str){
    var n = parseFloat(String(str).replace(',', '.').replace(/[^\d.\-]/g,''));
    return isNaN(n) ? null : n;
  }

  function formatEuro(n){
    if (n < 0) n = 0;
    return n.toFixed(2).replace('.', ',') + ' €';
  }

  function recomputeNowFromRemise(i){
    var it = STATE.items[i];
    var oldVal = money(it.old);
    var pct = parseFloat(String(it.remise).replace(',', '.'));
    if (oldVal === null || isNaN(pct)) return;
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    it.now = formatEuro(oldVal * (1 - pct / 100));
  }

  function recomputeRemiseFromNow(i){
    var it = STATE.items[i];
    var oldVal = money(it.old);
    var nowVal = money(it.now);
    if (!oldVal || nowVal === null) return;
    var pct = Math.round((1 - nowVal / oldVal) * 100);
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    it.remise = String(pct);
  }

  function categoryBadge(it){
    var keys = ['shonen', 'seinen', 'goodies', 'promo'];
    var tokens = (it.cat || '').split(/\s+/);
    for (var k = 0; k < keys.length; k++){
      if (tokens.indexOf(keys[k]) !== -1) return SETTINGS.categories[keys[k]];
    }
    return '';

  function authRequest(path, body){
    return fetch(SUPABASE_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify(body)
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        return { ok: res.ok, data: data };
      });
    });
  }

  function saveSession(s){
    try { localStorage.setItem('pcm_auth', JSON.stringify(s)); } catch(e){}
  }
  function clearSession(){
    try { localStorage.removeItem('pcm_auth'); } catch(e){}
  }
  function loadSession(){
    try {
      var raw = localStorage.getItem('pcm_auth');
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && saved.access_token && saved.user && saved.user.email &&
          saved.user.email.toLowerCase() === OWNER_EMAIL.toLowerCase()) {
        ui.auth.session = saved;
      } else {
        clearSession();
      }
    } catch(e){}
  }

  function applyAuthResult(r, isSignup){
    ui.auth.busy = false;
    if (r.ok && r.data && r.data.access_token) {
      var email = (r.data.user && r.data.user.email) || '';
      if (email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
        ui.auth.status = 'Cet espace est réservé à la propriétaire du site.';
        ui.auth.session = null;
        clearSession();
      } else {
        ui.auth.session = r.data;
        saveSession(r.data);
        ui.auth.status = '';
        ui.auth.open = false;
      }
    } else if (r.ok && isSignup) {
      ui.auth.status = 'Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.';
      ui.auth.mode = 'login';
    } else {
      var msg = (r.data && (r.data.msg || r.data.error_description || r.data.error)) || 'Une erreur est survenue.';
      ui.auth.status = msg;
    }
    render();
  }

  function doSignup(email, password){
    ui.auth.busy = true; ui.auth.status = ''; render();
    authRequest('/auth/v1/signup', { email: email, password: password })
      .then(function(r){ applyAuthResult(r, true); })
      .catch(function(){ ui.auth.busy = false; ui.auth.status = 'Erreur réseau, réessaie.'; render(); });
  }

  function doLogin(email, password){
    ui.auth.busy = true; ui.auth.status = ''; render();
    authRequest('/auth/v1/token?grant_type=password', { email: email, password: password })
      .then(function(r){ applyAuthResult(r, false); })
      .catch(function(){ ui.auth.busy = false; ui.auth.status = 'Erreur réseau, réessaie.'; render(); });
  }

  function render(){
    var chips = [
      {k:'all', l:'Tout'}, {k:'shonen', l:SETTINGS.categories.shonen}, {k:'seinen', l:SETTINGS.categories.seinen},
      {k:'goodies', l:SETTINGS.categories.goodies}, {k:'promo', l:SETTINGS.categories.promo}
    ].map(function(c){
      return '<button class="chip'+(ui.filter===c.k?' active':'')+'" type="button" data-filter="'+c.k+'">'+c.l+'</button>';
    }).join('');

    var cards = STATE.items.map(function(it, i){
      if (ui.filter !== 'all' && it.cat.indexOf(ui.filter) === -1) return '';
      return cardHTML(it, i);
    }).join('');

    var isHome = (ui.view !== 'contact' && ui.view !== 'vendre' && ui.view !== 'panier');

    var heroText = inSettings ? settingsDraft.texts.heroTitle : SETTINGS.texts.heroTitle;
    var navActionsHTML = ''+
        (inSettings ? '<button id="home-btn" class="btn btn-ghost" type="button" style="background:#ffffff;">← Accueil</button>' : '')+

        '<button class="cart-pill" type="button" id="cart-pill-btn">🛍️ Panier · '+ui.cart.length+'</button>';
    root.innerHTML = ''+
    (isHome ?
      '<div class="wrap"><div class="top-banner">'+
        '<img class="banner-photo" src="'+HERO_BANNER_SRC+'" alt="Bannière '+esc(brandText)+'">'+
        '<div class="banner-nav">'+
          '<div class="brand"><img class="brand-mark" src="'+LOGO_SRC+'" alt="Mascotte '+esc(brandText)+'"><span'+ce(inSettings)+(inSettings?' data-settings-field="texts.brand" data-placeholder="Nom du site"':'')+'>'+esc(brandText)+'</span></div>'+
        '</div>'+
        '<div class="banner-title"><h1'+ce(inSettings)+(inSettings?' data-settings-field="texts.heroTitle"':'')+'>'+esc(heroText)+'</h1></div>'+
      '</div>'+
      '<div class="banner-actions-row"><div class="header-actions">'+navActionsHTML+'</div></div>'+
      '</div>'
    :
      '<header class="site"><div class="site-inner">'+
        '<div class="brand"><img class="brand-mark" src="'+LOGO_SRC+'" alt="Mascotte '+esc(SETTINGS.texts.brand)+'">'+esc(SETTINGS.texts.brand)+'</div>'+
        '<div class="header-actions">'+navActionsHTML+'</div>'+
      '</div></header>'
    )+
    '<main class="wrap">'+
    (ui.view === 'contact' ? contactHTML().replace('wrap contact-page', 'contact-page') :
     ui.view === 'vendre' ? vendrePageHTML().replace('wrap vendre-page', 'vendre-page') :
     ui.view === 'panier' ? panierHTML().replace('wrap panier-page', 'panier-page') :
     ui.view === 'parametres' ? parametresHTML().replace('wrap parametres-page', 'parametres-page') : ''+
      '<section class="hero"><div class="hero-inner"><div>'+
        '<div class="hero-actions"><a class="btn btn-primary" href="#vendre" data-view="vendre">Je vends un manga</a></div>'+
        '<span class="eyebrow" style="margin:20px 0 0;">Seconde vie pour vos mangas</span>'+
      '</div></div></section>'+
      '<section id="catalogue" class="catalog">'+
        '<div class="filters">'+chips+'</div>'+
        '<div class="grid">'+cards+'</div>'+
      '</section>')+
    '</main>'+
    (inSettings ? '<div class="wrap" style="display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; padding:16px 0;">'+
      '<label style="display:inline-flex; align-items:center; gap:8px; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; box-shadow:var(--shadow); cursor:pointer; font-size:0.85rem;">'+
        '<input type="color" data-color-key="bodyBg" value="'+esc(settingsDraft.colors.bodyBg || '#faf5ff')+'">'+
        '<span>🎨 Fond du site</span>'+
      '</label>'+
      '<label style="display:inline-flex; align-items:center; gap:8px; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; box-shadow:var(--shadow); cursor:pointer; font-size:0.85rem;">'+
        '<input type="color" data-color-key="footerBg" value="'+esc(settingsDraft.colors.footerBg || '#ffffff')+'">'+
        '<span>🎨 Fond du pied de page</span>'+
      '</label>'+
      (settingsDraft.colors.footerBg ? '<label style="display:inline-flex; align-items:center; gap:8px; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; box-shadow:var(--shadow); cursor:pointer; font-size:0.85rem;">'+
        '<input type="color" data-color-key="footerInk" value="'+esc(settingsDraft.colors.footerInk || '#2c2a2e')+'">'+
        '<span>🎨 Texte du pied de page</span>'+
      '</label>' : '')+
      (settingsDraft.colors.bodyBg || settingsDraft.colors.footerBg || settingsDraft.colors.footerInk ? '<button type="button" id="bg-reset-btn" class="btn btn-ghost" style="background:#ffffff; padding:7px 14px; font-size:0.8rem;">Fonds par défaut</button>' : '')+
    '</div>' : '')+
    '<footer class="site"><div class="wrap footer-inner">'+
      '<div class="footer-brand"><img class="footer-mark" src="'+LOGO_SRC+'" alt="">'+esc(brandText)+'</div>'+
      '<nav class="footer-nav">'+
        '<a href="#vendre" data-view="vendre">Vendre un manga</a>'+
        '<a data-view="contact">Contact</a>'+
        '<span class="footer-copy" style="text-transform:none; letter-spacing:normal;"'+ce(inSettings)+(inSettings?' data-settings-field="texts.footerCopy"':'')+'>'+esc(inSettings?settingsDraft.texts.footerCopy:SETTINGS.texts.footerCopy)+'</span>'+
      '</nav>'+
    '</div></footer>'+
    '<div class="savebar'+(ui.editingIdx !== null?' show':'')+'"><div class="savebar-inner">'+
      '<span class="savebar-status" id="save-status">'+(ui.status||(ui.dirty?'Modifications non enregistrées':'Aucune modification'))+'</span>'+
      '<button class="save-btn" id="save-btn" type="button"'+(ui.dirty?'':' disabled')+'>💾 Enregistrer</button>'+
    '</div></div>';

    wire();
  }

  function wire(){
    root.querySelectorAll('.edit-item-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        ui.editingIdx = (ui.editingIdx === idx) ? null : idx;
        render();
      });
    });

    var authBtn = document.getElementById('auth-btn');
    if (authBtn) authBtn.addEventListener('click', function(ev){
      ev.stopPropagation();
      ui.auth.open = !ui.auth.open;
      render();
    });
    if (!outsideClickBound) {
      outsideClickBound = true;
      document.addEventListener('click', function(ev){
        if (ui.auth.open && !ev.target.closest('.auth-dropdown') && ev.target.id !== 'auth-btn') {
          ui.auth.open = false;
          render();
        }
      });
    }

    root.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        ui.filter = chip.getAttribute('data-filter');
        render();
      });
    });

    root.querySelectorAll('[data-view]').forEach(function(link){
      link.addEventListener('click', function(ev){
        var view = link.getAttribute('data-view');
        if (view === 'contact') {
          ev.preventDefault();
          ui.view = 'contact';
          ui.contactState = 'idle';
          render();
        } else if (view === 'vendre') {
          ev.preventDefault();
          if (!ui.auth.session) {
            ui.view = 'boutique';
            ui.auth.open = true;
            render();
            var authBtn = document.getElementById('auth-btn');
            if (authBtn) authBtn.scrollIntoView({block:'center'});
          } else {
            ui.view = 'vendre';
            render();
          }
        } else if (ui.view === 'contact' || ui.view === 'vendre') {
          ui.view = 'boutique';
          render();
          var target = document.querySelector(link.getAttribute('href'));
          if (target) target.scrollIntoView();
        }
      });
    });

    var contactForm = document.getElementById('contact-form');
    if (contactForm) contactForm.addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(contactForm);
      var payload = {
        nom_client: fd.get('nom'),
        email_client: fd.get('email'),
        article_titre: fd.get('article') || 'Non précisé',
        message: fd.get('message')
      };
      ui.contactState = 'sending';
      render();
      fetch(SUPABASE_URL + '/rest/v1/demandes_interet', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      }).then(function(res){
        ui.contactState = res.ok ? 'ok' : 'err';
        render();
      }).catch(function(){
        ui.contactState = 'err';
        render();
      });
    });

    root.querySelectorAll('[data-idx][data-field]').forEach(function(el){
      el.addEventListener('input', function(){
        var i = parseInt(el.getAttribute('data-idx'), 10);
        var f = el.getAttribute('data-field');
        STATE.items[i][f] = el.textContent;
        markDirty();
      });
    });

    function syncDiscountBadge(i){
      var it = STATE.items[i];
      var coverEl = root.querySelector('.card[data-card-idx="'+i+'"] .cover');
      if (!coverEl) return;
      var badgeEl = coverEl.querySelector('.discount-badge');
      var pct = parseInt(it.remise, 10);
      if (!it.sold && pct > 0) {
        if (!badgeEl) {
          badgeEl = document.createElement('span');
          badgeEl.className = 'discount-badge';
          coverEl.insertBefore(badgeEl, coverEl.firstChild.nextSibling);
        }
        badgeEl.textContent = '-'+pct+'%';
      } else if (badgeEl) {
        badgeEl.remove();
      }
    }

    root.querySelectorAll('[data-idx][data-field="remise"]').forEach(function(el){
      el.addEventListener('input', function(){
        var i = parseInt(el.getAttribute('data-idx'), 10);
        recomputeNowFromRemise(i);
        var priceNewEl = root.querySelector('.card[data-card-idx="'+i+'"] [data-field="now"]');
        if (priceNewEl) priceNewEl.textContent = STATE.items[i].now;
        syncDiscountBadge(i);
      });
    });

    root.querySelectorAll('[data-idx][data-field="old"]').forEach(function(el){
      el.addEventListener('input', function(){
        var i = parseInt(el.getAttribute('data-idx'), 10);
        recomputeNowFromRemise(i);
        var priceNewEl = root.querySelector('.card[data-card-idx="'+i+'"] [data-field="now"]');
        if (priceNewEl) priceNewEl.textContent = STATE.items[i].now;
      });
    });

    root.querySelectorAll('[data-idx][data-field="now"]').forEach(function(el){
      el.addEventListener('input', function(){
        var i = parseInt(el.getAttribute('data-idx'), 10);
        recomputeRemiseFromNow(i);
        var remiseEl = root.querySelector('.card[data-card-idx="'+i+'"] [data-field="remise"]');
        if (remiseEl) remiseEl.textContent = STATE.items[i].remise;
        syncDiscountBadge(i);
      });
    });

    root.querySelectorAll('[data-focus-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = btn.getAttribute('data-focus-idx');
        var field = btn.getAttribute('data-focus-field') || 't';
        var targetEl = root.querySelector('.card[data-card-idx="'+i+'"] [data-field="'+field+'"]');
        if (targetEl) targetEl.focus();
      });
    });

    root.querySelectorAll('[data-photo-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = btn.getAttribute('data-photo-idx');
        var input = root.querySelector('[data-photo-input-idx="'+i+'"]');
        if (input) input.click();
      });
    });

    root.querySelectorAll('[data-photo-input-idx]').forEach(function(input){
      input.addEventListener('change', function(){
        var i = parseInt(input.getAttribute('data-photo-input-idx'), 10);
        var file = input.files && input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          var img = new Image();
          img.onload = function(){
            var maxW = 900;
            var scale = Math.min(1, maxW / img.width);
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            STATE.items[i].img = canvas.toDataURL('image/jpeg', 0.85);
            markDirty();
            render();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    root.querySelectorAll('[data-color-edit-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-color-edit-idx'), 10);
        ui.colorEditIdx = (ui.colorEditIdx === i) ? null : i;
        render();
      });
    });

    root.querySelectorAll('[data-hue-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-hue-idx'), 10);
        STATE.items[i].hue = btn.getAttribute('data-hue-val');
        markDirty();
        render();
      });
    });

    root.querySelectorAll('[data-hue-input-idx]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var i = inp.getAttribute('data-hue-input-idx');
        STATE.items[parseInt(i, 10)].hue = inp.value;
        markDirty();
        var cov = root.querySelector('.card[data-card-idx="'+i+'"] .cover');
        if (cov) cov.style.background = 'linear-gradient(160deg,'+inp.value+', color-mix(in srgb, '+inp.value+' 60%, var(--ink) 15%))';
      });
    });

    root.querySelectorAll('[data-hue-confirm-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        ui.colorEditIdx = null;
        render();
      });
    });

    root.querySelectorAll('[data-fiche]').forEach(function(el){
      el.addEventListener('input', function(){
        var f = el.getAttribute('data-fiche');
        STATE.fiche[f] = el.textContent;
        markDirty();
        if (f === 'achat' || f === 'vente') {
          var mv = document.getElementById('marge-val');
          if (mv) {
            var achat = money(STATE.fiche.achat), vente = money(STATE.fiche.vente);
            mv.textContent = (achat !== null && vente !== null) ? (vente - achat).toFixed(2).replace('.', ',') + ' €' : 'N/A';
          }
        }
      });
    });

    var saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.addEventListener('click', doSave);

    var authForm = document.getElementById('auth-form');
    if (authForm) authForm.addEventListener('submit', function(ev){
      ev.preventDefault();
      var email = document.getElementById('auth-email').value.trim();
      var pw = document.getElementById('auth-password').value;
      if (ui.auth.mode === 'signup') doSignup(email, pw); else doLogin(email, pw);
    });
    var authToggle = document.getElementById('auth-toggle');
    if (authToggle) authToggle.addEventListener('click', function(ev){
      ev.preventDefault();
      ui.auth.mode = ui.auth.mode === 'signup' ? 'login' : 'signup';
      ui.auth.status = '';
      render();
    });
    var logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) logoutBtn.addEventListener('click', doLogout);
    var settingsBtn = document.getElementById('settings-btn');
    if (settingsBtn) settingsBtn.addEventListener('click', function(){
      ui.auth.open = false;
      ui.view = 'parametres';
      ui.editingIdx = null;
      settingsDraft = JSON.parse(JSON.stringify(SETTINGS));
      settingsStatus = '';
      render();
      window.scrollTo({top:0, behavior:'auto'});
    });
    root.querySelectorAll('[data-color-key]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var key = inp.getAttribute('data-color-key');
        settingsDraft.colors[key] = inp.value;
        markSettingsDirty();
      });
      inp.addEventListener('change', function(){ render(); });
    });
    var bgResetBtn = document.getElementById('bg-reset-btn');
    if (bgResetBtn) bgResetBtn.addEventListener('click', function(){
      settingsDraft.colors.bodyBg = '';
      settingsDraft.colors.footerBg = '';
      settingsDraft.colors.footerInk = '';
      markSettingsDirty();
      render();
    });
    root.querySelectorAll('[data-settings-field]').forEach(function(el){
      el.addEventListener('input', function(){
        var path = el.getAttribute('data-settings-field').split('.');
        var obj = settingsDraft;
        for (var k = 0; k < path.length - 1; k++) obj = obj[path[k]];
        obj[path[path.length - 1]] = el.textContent;
        markSettingsDirty();
      });
    });
    var bgImageInput = document.getElementById('bg-image-input');
    if (bgImageInput) bgImageInput.addEventListener('change', function(){
      var file = bgImageInput.files && bgImageInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var maxW = 1600;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          settingsDraft.colors.bgImage = canvas.toDataURL('image/jpeg', 0.82);
          markSettingsDirty();
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    var bgImageRemoveBtn = document.getElementById('bg-image-remove-btn');
    if (bgImageRemoveBtn) bgImageRemoveBtn.addEventListener('click', function(){
      settingsDraft.colors.bgImage = '';
      markSettingsDirty();
      render();
    });
    var settingsSaveBtn = document.getElementById('settings-save-btn');
    if (settingsSaveBtn) settingsSaveBtn.addEventListener('click', saveSiteSettings);
    var settingsResetBtn = document.getElementById('settings-reset-btn');
    if (settingsResetBtn) settingsResetBtn.addEventListener('click', function(){
      settingsDraft = JSON.parse(JSON.stringify(SETTINGS));
      settingsStatus = '';
      render();
    });
    var homeBtn = document.getElementById('home-btn');
    if (homeBtn) homeBtn.addEventListener('click', function(){
      ui.view = 'boutique';
      ui.editingIdx = null;
      render();
      window.scrollTo({top:0, behavior:'auto'});
    });
    var cartPillBtn = document.getElementById('cart-pill-btn');
    if (cartPillBtn) cartPillBtn.addEventListener('click', function(){
      ui.view = 'panier';
      render();
      window.scrollTo({top:0, behavior:'auto'});
    });
    root.querySelectorAll('.add-btn[data-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-idx'), 10);
        var pos = ui.cart.indexOf(i);
        if (pos === -1) ui.cart.push(i); else ui.cart.splice(pos, 1);
        render();
      });
    });
    root.querySelectorAll('[data-cart-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-cart-idx'), 10);
        var pos = ui.cart.indexOf(i);
        if (pos !== -1) ui.cart.splice(pos, 1);
        render();
      });
    });
    var addFicheCard = document.getElementById('add-fiche-card');
    if (addFicheCard) addFicheCard.addEventListener('click', function(){
      ui.ficheModalOpen = true;
      render();
      var titreEl = document.querySelector('[data-fiche="titre"]');
      if (titreEl) titreEl.focus();
    });
    var ficheModalClose = document.getElementById('fiche-modal-close');
    if (ficheModalClose) ficheModalClose.addEventListener('click', function(){
      ui.ficheModalOpen = false;
      render();
    });
    var ficheModalOverlay = document.getElementById('fiche-modal-overlay');
    if (ficheModalOverlay) ficheModalOverlay.addEventListener('click', function(ev){
      if (ev.target === ficheModalOverlay) { ui.ficheModalOpen = false; render(); }
    });
    var addProductBtn = document.getElementById('add-product-btn');
    if (addProductBtn) addProductBtn.addEventListener('click', function(){
      var f = STATE.fiche;
      if (!f.titre || !f.titre.trim() || !f.origine || !f.origine.trim() || !f.vente || !f.vente.trim()) return;
      var hues = ['var(--sage)', 'var(--lavender)', 'var(--gold)'];
      STATE.items.push({
        t: f.titre.trim(),
        d: (f.etat && f.etat.trim()) || 'Bon état général, à compléter avec tes propres notes.',
        old: f.origine.trim(),
        now: f.vente.trim(),
        remise: (f.remise && f.remise.trim()) || '0',
        tag: 'Manga',
        cat: 'manga',
        hue: hues[STATE.items.length % hues.length],
        img: ui.fichePhoto || LOGO_SRC
      });
      STATE.fiche = { titre: '', etat: '', origine: '', achat: '', vente: '', remise: '' };
      ui.fichePhoto = null;
      ui.ficheModalOpen = false;
      ui.addMsg = '✓ Ajouté au catalogue';
      markDirty();
      render();
    });
    var fichePhotoInput = document.getElementById('fiche-photo-input');
    if (fichePhotoInput) fichePhotoInput.addEventListener('change', function(ev){
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        ui.fichePhoto = reader.result;
        render();
      };
      reader.readAsDataURL(file);
    });
    var fichePhotoRemove = document.getElementById('fiche-photo-remove');
    if (fichePhotoRemove) fichePhotoRemove.addEventListener('click', function(){
      ui.fichePhoto = null;
      render();
    });
  }

  function markSettingsDirty(){
    settingsStatus = '';
    var status = document.getElementById('settings-status');
    if (status) { status.textContent = 'Modifications non enregistrées'; status.className = 'form-status'; }
  }

  function markDirty(){
    ui.dirty = true;
    ui.status = '';
    var status = document.getElementById('save-status');
    var btn = document.getElementById('save-btn');
    if (status) status.textContent = 'Modifications non enregistrées';
    if (btn) btn.disabled = false;
  }

  function fullDocumentHTML(){
    var head = document.head.outerHTML;
    var dataScript = '<script type="application/json" id="state-data">' +
      JSON.stringify(STATE).replace(/</g, '\\u003c') + '<' + '/script>';
    var logic = document.getElementById('logic-script').outerHTML;
    return '<!doctype html>\n<html>' + head + '<body>' + dataScript + '<div id="root"></div>' + logic + '</body></html>';
  }

  function doSave(){
    if (!artifactCap) {
      ui.status = 'Sauvegarde indisponible dans cet aperçu.';
      render();
      return;
    }
    var status = document.getElementById('save-status');
    var btn = document.getElementById('save-btn');
    if (status) status.textContent = 'Enregistrement…';
    if (btn) btn.disabled = true;

    artifactCap.publish(fullDocumentHTML()).then(function(){
      ui.dirty = false;
      ui.status = 'Enregistré ✓';
      render();
    }).catch(function(err){
      var code = err && err.code;
      if (code === 'conflict') {
        // la vue va être rechargée automatiquement vers la version publiée entre-temps
        return;
      }
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
        ui.status = 'Lecture seule ici : tu ne peux pas enregistrer depuis cette vue.';
      } else if (code === 'rate_limited') {
        ui.status = 'Trop d\'enregistrements rapprochés, patiente un instant.';
      } else {
        ui.status = 'Échec de l\'enregistrement, réessaie.';
      }
      render();
    });
  }

  loadSession();
  render();
  fetchSiteSettings();
})();
</script>
