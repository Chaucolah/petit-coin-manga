<meta charset="utf-8">
<title>Petit Coin Manga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0; --surface:#ffffff; --surface-2:#f3ede3;
    --ink:#2c2a2e; --ink-soft:#6b6873; --line:#e6ddcf;
    --sage:#6e9083; --sage-ink:#2f453e; --lavender:#8d86a8;
    --gold:#b1852f; --gold-bg:#f4e6cb;
    --shadow: 0 1px 2px rgba(44,42,46,0.04), 0 8px 24px rgba(44,42,46,0.06);
    --radius: 14px;
  }
  /* Le site reste toujours en thème clair, meme si l'appareil est en mode sombre */
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Manrope', system-ui, sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Comfortaa','Manrope',system-ui,sans-serif; text-wrap:balance; font-weight:700; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  header.site{position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .site-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-size:1.15rem; color:var(--ink);}
  .brand-mark{width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover; box-shadow:0 0 0 1px var(--line);}
  nav.site-nav{display:flex; gap:28px; font-size:0.92rem; color:var(--ink-soft);}
  nav.site-nav a{text-decoration:none; cursor:pointer; padding-bottom:2px; border-bottom:2px solid transparent;}
  nav.site-nav a:hover{color:var(--ink);}
  nav.site-nav a.active{color:var(--ink); border-bottom-color:var(--sage);}

  .contact-page{padding:56px 0 72px; display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start;}
  .contact-page h1{font-size:2rem; margin:0 0 12px;}
  .contact-page p.lead{color:var(--ink-soft); font-size:1rem; max-width:42ch; margin:0 0 22px;}
  .contact-info{display:flex; flex-direction:column; gap:10px; font-size:0.92rem; color:var(--ink-soft);}
  .contact-info strong{color:var(--ink);}
  .contact-form{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; display:flex; flex-direction:column; gap:16px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field label{font-size:0.82rem; font-weight:700; color:var(--ink-soft);}
  .form-field input, .form-field textarea{
    font-family:inherit; font-size:0.92rem; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; resize:vertical;
  }
  .form-field input:focus, .form-field textarea:focus{outline:2px solid var(--sage); border-color:var(--sage);}
  .contact-form .btn-primary{align-self:flex-start;}
  .contact-form .btn-primary:disabled{opacity:0.6; cursor:default;}
  .form-status{font-size:0.86rem; padding:2px 0;}
  .form-status.ok{color:var(--sage-ink);}
  .form-status.err{color:#b1452f;}
  @media (max-width:760px){ .contact-page{grid-template-columns:1fr;} }
  .header-actions{display:flex; align-items:center; gap:10px;}
  .cart-pill, .edit-toggle{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:0.88rem; font-weight:600; background:var(--surface);}
  .edit-toggle{cursor:pointer; color:var(--ink);}
  .edit-toggle.active{background:var(--sage); border-color:var(--sage); color:#fff;}

  .hero{padding:56px 0 40px;}
  .hero-inner{display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--sage-ink); background:color-mix(in srgb, var(--sage) 16%, transparent); border-radius:999px; padding:6px 12px; margin-bottom:18px;}
  .hero h1{font-size:clamp(2rem, 4vw, 2.9rem); margin:0 0 16px; line-height:1.12;}
  .hero p.lead{color:var(--ink-soft); font-size:1.05rem; max-width:46ch; margin:0 0 26px;}
  .hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
  .btn{border:none; border-radius:999px; padding:13px 24px; font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--sage); color:#fff;}
  .btn-primary:hover{background:color-mix(in srgb, var(--sage) 85%, black);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .hero-art{aspect-ratio:4/3; border-radius:20px; background:radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--gold) 55%, transparent), transparent 55%), radial-gradient(circle at 75% 70%, color-mix(in srgb, var(--lavender) 55%, transparent), transparent 55%), linear-gradient(135deg, var(--sage), var(--lavender)); position:relative; overflow:hidden; box-shadow:var(--shadow);}
  .hero-art svg{position:absolute; inset:0; width:100%; height:100%;}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 32px;}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px; font-size:0.86rem; font-weight:600; cursor:pointer; color:var(--ink-soft); transition:all .15s ease;}
  .chip:hover{color:var(--ink); border-color:var(--ink-soft);}
  .chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  section.catalog{padding:8px 0 64px;}
  .catalog h2{font-size:1.5rem; margin:0 0 4px;}
  .catalog .sub{color:var(--ink-soft); font-size:0.94rem; margin:0 0 24px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:20px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;}
  .cover{aspect-ratio:3/4; position:relative; display:flex; align-items:center; justify-content:center; color:#fff;}
  .cover svg{width:46%; height:46%; opacity:0.92;}
  .cover .badge{position:absolute; top:10px; left:10px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; background:rgba(255,255,255,0.92); color:var(--ink); border-radius:999px; padding:4px 10px;}
  .cover .photo-note{position:absolute; bottom:10px; right:10px; font-size:0.66rem; background:rgba(0,0,0,0.35); color:#fff; border-radius:6px; padding:3px 7px;}
  .card-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card-body h3{font-size:0.98rem; margin:0; font-family:'Manrope'; font-weight:700;}
  .card-body .desc{font-size:0.83rem; color:var(--ink-soft); margin:0;}
  .price-row{margin-top:auto; display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums;}
  .price-old{color:var(--ink-soft); text-decoration:line-through; font-size:0.84rem;}
  .price-new{color:var(--gold); font-weight:800; font-size:1.15rem;}
  .add-row{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
  .add-btn{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 13px; font-size:0.78rem; font-weight:700; color:var(--ink); cursor:pointer;}
  .add-btn:hover{background:var(--sage); border-color:var(--sage); color:#fff;}

  [contenteditable="true"]{outline:1px dashed color-mix(in srgb, var(--sage) 55%, transparent); border-radius:4px; padding:1px 4px; margin:-1px -4px; cursor:text;}
  [contenteditable="true"]:hover{outline-color:var(--sage);}
  [contenteditable="true"]:focus{outline:2px solid var(--sage); background:color-mix(in srgb, var(--sage) 10%, transparent);}

  section.seller{padding:24px 0 72px;}
  .seller-box{background:var(--surface-2); border:1px dashed var(--line); border-radius:20px; padding:28px; display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start;}
  .seller-box h2{font-size:1.25rem; margin:0 0 8px;}
  .seller-box p{color:var(--ink-soft); font-size:0.9rem; margin:0 0 16px; max-width:44ch;}
  .field-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:0.86rem;}
  .field-list li{display:flex; justify-content:space-between; gap:12px; padding:4px 0; border-bottom:1px solid var(--line);}
  .field-list span:first-child{color:var(--ink-soft); flex:none;}
  .field-list span:last-child{font-weight:700; font-variant-numeric:tabular-nums; text-align:right;}
  .margin-line span:last-child{color:var(--sage-ink); background:color-mix(in srgb, var(--sage) 18%, transparent); padding:2px 8px; border-radius:6px;}
  .internal-tag{display:inline-block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); background:var(--gold-bg); border-radius:6px; padding:3px 8px; margin-bottom:10px;}

  footer.site{border-top:1px solid var(--line); padding:28px 0; margin-top:0;}
  .footer-inner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; color:var(--ink-soft); font-size:0.84rem;}

  .savebar{position:sticky; bottom:0; z-index:9; display:none; justify-content:center; padding:14px; background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .savebar.show{display:flex;}
  .savebar-inner{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:999px; padding:8px 10px 8px 18px;}
  .savebar-status{font-size:0.83rem; color:var(--ink-soft);}
  .save-btn{background:var(--ink); color:var(--bg); border:none; border-radius:999px; padding:10px 18px; font-family:inherit; font-weight:700; font-size:0.85rem; cursor:pointer;}
  .save-btn:disabled{opacity:0.5; cursor:default;}

  @media (max-width:760px){
    .hero-inner{grid-template-columns:1fr;}
    .hero-art{order:-1;}
    .seller-box{grid-template-columns:1fr;}
    nav.site-nav{display:none;}
  }
</style>

  var STATE = JSON.parse(document.getElementById('state-data').textContent);
  var ui = { view: 'boutique', filter: 'all', editMode: false, dirty: false, status: '', contactState: 'idle' };
  var root = document.getElementById('root');
  var artifactCap = null;
  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function(cap){ artifactCap = cap; });

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function ce(on){ return on ? ' contenteditable="true"' : ''; }

  function money(str){
    var n = parseFloat(String(str).replace(',', '.').replace(/[^\d.\-]/g,''));
    return isNaN(n) ? null : n;
  }

  function cardHTML(it, i){
    return ''+
      '<div class="card">'+
        '<div class="cover" style="background:linear-gradient(160deg,'+it.hue+', color-mix(in srgb, '+it.hue+' 60%, var(--ink) 15%))">'+
          '<span class="badge">'+esc(it.tag)+'</span>'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M18 20a3 3 0 0 0 0-6"/></svg>'+
          '<span class="photo-note">photo à venir</span>'+
        '</div>'+
        '<div class="card-body">'+
          '<h3'+ce(ui.editMode)+' data-idx="'+i+'" data-field="t">'+esc(it.t)+'</h3>'+
          '<p class="desc"'+ce(ui.editMode)+' data-idx="'+i+'" data-field="d">'+esc(it.d)+'</p>'+
          '<div class="price-row">'+
            '<span class="price-old"'+ce(ui.editMode)+' data-idx="'+i+'" data-field="old">'+esc(it.old)+'</span>'+
            '<span class="price-new"'+ce(ui.editMode)+' data-idx="'+i+'" data-field="now">'+esc(it.now)+'</span>'+
          '</div>'+
          '<div class="add-row"><span style="font-size:0.75rem; color:var(--ink-soft);">Stock: 1</span><button class="add-btn" type="button">Ajouter</button></div>'+
        '</div>'+
      '</div>';
  }

  function sellerHTML(){
    var f = STATE.fiche;
    var achat = money(f.achat), vente = money(f.vente);
    var marge = (achat !== null && vente !== null) ? (vente - achat).toFixed(2).replace('.', ',') + ' €' : '—';
    return ''+
      '<div class="seller-box">'+
        '<div>'+
          '<span class="internal-tag">Fiche interne · usage vendeuse</span>'+
          '<h2>Un suivi simple derrière chaque annonce</h2>'+
          '<p>Le prix d\'achat et la marge restent privés — seuls la description, le prix d\'origine et le prix de vente sont visibles côté boutique.</p>'+
          '<ul class="field-list">'+
            '<li><span>Titre</span><span'+ce(ui.editMode)+' data-fiche="titre">'+esc(f.titre)+'</span></li>'+
            '<li><span>État</span><span'+ce(ui.editMode)+' data-fiche="etat">'+esc(f.etat)+'</span></li>'+
            '<li><span>Prix d\'origine</span><span'+ce(ui.editMode)+' data-fiche="origine">'+esc(f.origine)+'</span></li>'+
            '<li><span>Prix d\'achat (privé)</span><span'+ce(ui.editMode)+' data-fiche="achat">'+esc(f.achat)+'</span></li>'+
            '<li><span>Prix de vente</span><span'+ce(ui.editMode)+' data-fiche="vente">'+esc(f.vente)+'</span></li>'+
            '<li class="margin-line"><span>Marge estimée</span><span id="marge-val">'+marge+'</span></li>'+
          '</ul>'+
        '</div>'+
        '<div>'+
          '<span class="internal-tag">Ajout photo</span>'+
          '<h2 style="font-size:1.05rem; margin-bottom:6px;">Zone de dépôt</h2>'+
          '<p>Glissez une ou plusieurs photos par annonce — couverture, dos, tranche, détail d\'un défaut éventuel.</p>'+
          '<div style="border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; color:var(--ink-soft); font-size:0.85rem; background:var(--surface);">📷 Glisser une photo ici, ou parcourir</div>'+
        '</div>'+
      '</div>';
  }

  function contactHTML(){
    var statusHTML = '';
    if (ui.contactState === 'sending') statusHTML = '<p class="form-status">Envoi en cours…</p>';
    else if (ui.contactState === 'ok') statusHTML = '<p class="form-status ok">✓ Message envoyé, merci ! On te répond vite.</p>';
    else if (ui.contactState === 'err') statusHTML = '<p class="form-status err">Échec de l\'envoi, réessaie dans un instant.</p>';

    return ''+
    '<div class="wrap contact-page">'+

        '<h1>Écris-nous</h1>'+

        '<div class="contact-info">'+

        '</div>'+
      '</div>'+
      '<form class="contact-form" id="contact-form">'+
        '<div class="form-field"><label for="cf-nom">Ton prénom</label><input id="cf-nom" name="nom" type="text" required></div>'+
        '<div class="form-field"><label for="cf-email">Ton email</label><input id="cf-email" name="email" type="email" required></div>'+
        '<div class="form-field"><label for="cf-article">Article concerné (optionnel)</label><input id="cf-article" name="article" type="text" placeholder="Ex: One Piece — Tome 12"></div>'+
        '<div class="form-field"><label for="cf-message">Ton message</label><textarea id="cf-message" name="message" rows="4" required></textarea></div>'+
        statusHTML+
        '<button class="btn btn-primary" type="submit"'+(ui.contactState==='sending'?' disabled':'')+'>Envoyer le message</button>'+
      '</form>'+
    '</div>';
  }

  function render(){
    var chips = [
      {k:'all', l:'Tout'}, {k:'shonen', l:'Shônen'}, {k:'seinen', l:'Seinen'},
      {k:'goodies', l:'Goodies'}, {k:'promo', l:'En promo'}
    ].map(function(c){
      return '<button class="chip'+(ui.filter===c.k?' active':'')+'" type="button" data-filter="'+c.k+'">'+c.l+'</button>';
    }).join('');

    var cards = STATE.items.map(function(it, i){
      if (ui.filter !== 'all' && it.cat.indexOf(ui.filter) === -1) return '';
      return cardHTML(it, i);
    }).join('');

    root.innerHTML = ''+
    '<header class="site"><div class="site-inner">'+
      '<div class="brand"><img class="brand-mark" src="'+LOGO_SRC+'" alt="Mascotte Petit Coin Manga">Petit Coin Manga</div>'+
      '<nav class="site-nav">'+
        '<a href="#catalogue" data-view="boutique">Catalogue</a>'+
        '<a href="#vendre" data-view="boutique">Vendre un manga</a>'+
        '<a data-view="contact" class="'+(ui.view==='contact'?'active':'')+'">Contact</a>'+
      '</nav>'+
      '<div class="header-actions">'+
        '<button class="edit-toggle'+(ui.editMode?' active':'')+'" type="button" id="edit-toggle">'+(ui.editMode?'✓ Édition en cours':'✏️ Modifier les fiches')+'</button>'+
        '<div class="cart-pill">🛍️ Panier · 0</div>'+
      '</div>'+
    '</div></header>'+
    '<main class="wrap">'+
    (ui.view === 'contact' ? contactHTML().replace('wrap contact-page', 'contact-page') : ''+
      '<section class="hero"><div class="hero-inner"><div>'+
        '<span class="eyebrow">Seconde vie pour vos mangas</span>'+
        '<h1>Des mangas et objets geek qui méritent une nouvelle étagère.</h1>'+
        '<p class="lead">Chaque pièce est décrite, photographiée et évaluée à la main — état, édition, prix d\'origine et prix bradé, toujours transparents.</p>'+
        '<div class="hero-actions"><a class="btn btn-primary" href="#catalogue">Voir le catalogue</a><a class="btn btn-ghost" href="#vendre">Je vends un manga</a></div>'+
      '</div><div class="hero-art"><svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice">'+
        '<rect x="18" y="20" width="34" height="110" rx="3" fill="rgba(255,255,255,0.85)"/>'+
        '<rect x="56" y="30" width="34" height="100" rx="3" fill="rgba(255,255,255,0.65)"/>'+
        '<rect x="94" y="14" width="34" height="116" rx="3" fill="rgba(255,255,255,0.9)"/>'+
        '<rect x="132" y="26" width="34" height="104" rx="3" fill="rgba(255,255,255,0.55)"/>'+
      '</svg></div></div></section>'+
      '<section id="catalogue" class="catalog">'+
        '<h2>Catalogue</h2><p class="sub">'+STATE.items.length+' pièces en ligne · nouveaux arrivages chaque semaine</p>'+
        '<div class="filters">'+chips+'</div>'+
        '<div class="grid">'+cards+'</div>'+
      '</section>'+
      '<section class="seller" id="vendre">'+sellerHTML()+'</section>')+
    '</main>'+
    '<footer class="site"><div class="wrap footer-inner">'+
      '<span>© 2026 Petit Coin Manga — ébauche de site, à affiner ensemble.</span><span>contact@petitcoinmanga.fr</span>'+
    '</div></footer>'+
    '<div class="savebar'+(ui.editMode?' show':'')+'"><div class="savebar-inner">'+
      '<span class="savebar-status" id="save-status">'+(ui.status||(ui.dirty?'Modifications non enregistrées':'Aucune modification'))+'</span>'+
      '<button class="save-btn" id="save-btn" type="button"'+(ui.dirty?'':' disabled')+'>💾 Enregistrer</button>'+
    '</div></div>';

    wire();
  }

  function wire(){
    var editBtn = document.getElementById('edit-toggle');
    if (editBtn) editBtn.addEventListener('click', function(){
      ui.editMode = !ui.editMode;
      render();
    });

    root.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        ui.filter = chip.getAttribute('data-filter');
        render();
      });
    });

    root.querySelectorAll('.site-nav [data-view]').forEach(function(link){
      link.addEventListener('click', function(ev){
        var view = link.getAttribute('data-view');
        if (view === 'contact') {
          ev.preventDefault();
          ui.view = 'contact';
          ui.contactState = 'idle';
          render();
        } else if (ui.view === 'contact') {
          ui.view = 'boutique';
          render();
          var target = document.querySelector(link.getAttribute('href'));
          if (target) target.scrollIntoView();
        }
      });
    });

    var contactForm = document.getElementById('contact-form');
    if (contactForm) contactForm.addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(contactForm);
      var payload = {
        nom_client: fd.get('nom'),
        email_client: fd.get('email'),
        article_titre: fd.get('article') || 'Non précisé',
        message: fd.get('message')
      };
      ui.contactState = 'sending';
      render();
      fetch(SUPABASE_URL + '/rest/v1/demandes_interet', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      }).then(function(res){
        ui.contactState = res.ok ? 'ok' : 'err';
        render();
      }).catch(function(){
        ui.contactState = 'err';
        render();
      });
    });

    root.querySelectorAll('[data-idx][data-field]').forEach(function(el){
      el.addEventListener('input', function(){
        var i = parseInt(el.getAttribute('data-idx'), 10);
        var f = el.getAttribute('data-field');
        STATE.items[i][f] = el.textContent;
        markDirty();
      });
    });

    root.querySelectorAll('[data-fiche]').forEach(function(el){
      el.addEventListener('input', function(){
        var f = el.getAttribute('data-fiche');
        STATE.fiche[f] = el.textContent;
        markDirty();
        if (f === 'achat' || f === 'vente') {
          var mv = document.getElementById('marge-val');
          if (mv) {
            var achat = money(STATE.fiche.achat), vente = money(STATE.fiche.vente);
            mv.textContent = (achat !== null && vente !== null) ? (vente - achat).toFixed(2).replace('.', ',') + ' €' : '—';
          }
        }
      });
    });

    var saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.addEventListener('click', doSave);
  }

  function markDirty(){
    ui.dirty = true;
    ui.status = '';
    var status = document.getElementById('save-status');
    var btn = document.getElementById('save-btn');
    if (status) status.textContent = 'Modifications non enregistrées';
    if (btn) btn.disabled = false;
  }

  function fullDocumentHTML(){
    var head = document.head.outerHTML;
    var dataScript = '<script type="application/json" id="state-data">' +
      JSON.stringify(STATE).replace(/</g, '\\u003c') + '<' + '/script>';
    var logic = document.getElementById('logic-script').outerHTML;
    return '<!doctype html>\n<html>' + head + '<body>' + dataScript + '<div id="root"></div>' + logic + '</body></html>';
  }

  function doSave(){
    if (!artifactCap) {
      ui.status = 'Sauvegarde indisponible dans cet aperçu.';
      render();
      return;
    }
    var status = document.getElementById('save-status');
    var btn = document.getElementById('save-btn');
    if (status) status.textContent = 'Enregistrement…';
    if (btn) btn.disabled = true;

    artifactCap.publish(fullDocumentHTML()).then(function(){
      ui.dirty = false;
      ui.status = 'Enregistré ✓';
      render();
    }).catch(function(err){
      var code = err && err.code;
      if (code === 'conflict') {
        // la vue va être rechargée automatiquement vers la version publiée entre-temps
        return;
      }
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
        ui.status = 'Lecture seule ici — tu ne peux pas enregistrer depuis cette vue.';
      } else if (code === 'rate_limited') {
        ui.status = 'Trop d\'enregistrements rapprochés — patiente un instant.';
      } else {
        ui.status = 'Échec de l\'enregistrement, réessaie.';
      }
      render();
    });
  }

  render();
})();
</script>
